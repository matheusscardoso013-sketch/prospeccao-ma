name: Vigia da rodada diária

# Rede de segurança rodando na infraestrutura do GitHub — independente da máquina de
# qualquer pessoa e do cron-job.org. Faz duas coisas:
#
#   1. MANTÉM A INSTÂNCIA ACORDADA durante a rodada. O free tier do Render hiberna após
#      ~15 min sem requisição de entrada, e trabalho em segundo plano NÃO conta como
#      requisição. Com 12 leads/dia a rodada passa de 15 min, então sem esses pings ela
#      seria interrompida no meio — desperdiçando a cota de IA já gasta.
#   2. CONFERE se a rodada do dia saiu e falha (e-mail do GitHub) se não saiu.
#
# NÃO dispara a rodada: quem decide é o app, senão rodaríamos duas vezes no mesmo dia.
# Por isso também não precisa de token nem secret.

on:
  schedule:
    # 15:05 UTC = 12:05 em Brasília — logo após o horário da rodada (12h), para acompanhar
    # a janela inteira. Cron do GitHub é sempre UTC e pode atrasar alguns minutos em pico.
    - cron: "5 15 * * *"
  workflow_dispatch:

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar a plataforma
        # Primeiro acesso após hibernação pode levar ~1 min; insistimos por até 5.
        run: |
          for tentativa in $(seq 1 10); do
            codigo=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
              https://prospeccao-ma.onrender.com/Jobs/Saude || echo "000")
            echo "tentativa $tentativa: HTTP $codigo"
            case "$codigo" in
              2*) echo "Plataforma no ar."; exit 0 ;;
            esac
            sleep 30
          done
          echo "::error::A plataforma não respondeu em 5 minutos."
          exit 1

      - name: Manter acordada durante a rodada
        # Um ping a cada 4 min por 20 min: nunca fica 15 min sem requisição, que é o
        # limite de hibernação do Render.
        run: |
          for i in $(seq 1 5); do
            sleep 240
            estado=$(curl -sS --max-time 60 https://prospeccao-ma.onrender.com/Jobs/Saude || echo "sem resposta")
            echo "ping $i: $estado"
          done

      - name: Conferir se a rodada do dia saiu
        run: |
          saude=$(curl -sS --max-time 60 https://prospeccao-ma.onrender.com/Jobs/Saude)
          echo "$saude"
          case "$saude" in
            *'"rodouHoje":true'*)
              echo "OK: a rodada de hoje saiu." ;;
            *'"emAndamento":true'*)
              echo "A rodada ainda está em andamento — sem alarme." ;;
            *)
              echo "::error::Sem rodada hoje e nada em andamento. Ver /Execucoes na plataforma."
              exit 1 ;;
          esac
